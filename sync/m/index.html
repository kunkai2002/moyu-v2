<!DOCTYPE html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>moyu · workspace</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1a1915">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="app.css">
</head>
<body>

<header class="top" id="top">
  <button class="ic" id="btnBack" hidden title="返回">‹</button>
  <button class="ic" id="btnToc" hidden title="檔案">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <div class="ttl" id="title">魔芋一夏</div>
  <button class="ic" id="btnFont" hidden title="字級">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 12h4M12 12h8M4 17h12M20 17h0"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="17" r="2"/></svg>
  </button>
  <button class="ic" id="btnTheme" title="換色">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8"/><path d="M12 4v16"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
  </button>
</header>

<div class="fz" id="fz" hidden>
  <button class="fz-b" id="fzMinus">A−</button>
  <span class="fz-v" id="fzVal">17</span>
  <button class="fz-b" id="fzPlus">A+</button>
</div>

<main id="view"></main>

<div class="toc" id="toc" hidden>
  <div class="toc-h"><b>檔案</b><button class="ic" id="tocClose">✕</button></div>
  <div class="toc-l" id="tocList"></div>
</div>
<div class="mask" id="mask" hidden></div>

<div class="pill" id="remember" hidden>sync</div>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
