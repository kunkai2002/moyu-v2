<!DOCTYPE html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>魔芋一夏 · 遊客預覽</title>
<meta name="theme-color" content="#1a1915">
<style>
  :root{--bg:#1a1915;--bg2:#211f1a;--fg:#e8e3d9;--fg2:#b9b2a4;--fg3:#7d776c;
    --line:#332f28;--line2:#453f35;--acc:#d97757;--fs:17px;--lh:1.95;
    --serif:"Source Han Serif TC","Noto Serif TC","Songti TC",PMingLiU,Georgia,serif;
    --ui:-apple-system,"PingFang TC","Microsoft JhengHei UI",system-ui,sans-serif}
  [data-theme="light"]{--bg:#faf7f2;--bg2:#fff;--fg:#2b2822;--fg2:#5d574c;--fg3:#8d867a;
    --line:#e6e0d6;--line2:#d5cec2;--acc:#c25a34}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{min-height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--ui);
    -webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;background:none;border:0;padding:0}
  .top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:6px;
    height:48px;padding:0 8px;background:color-mix(in srgb,var(--bg) 92%,transparent);
    backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .ic{width:40px;height:40px;display:grid;place-items:center;color:var(--fg2);border-radius:9px}
  .ic:active{background:var(--bg2)}
  .ic svg{width:20px;height:20px}
  .ttl{flex:1;font-size:13px;color:var(--fg2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .guest{padding:10px 14px;font-size:11.5px;line-height:1.6;color:var(--fg3);
    background:color-mix(in srgb,var(--acc) 8%,transparent);border-bottom:1px solid var(--line)}
  .guest b{color:var(--acc);font-weight:600}
  .shelf{padding:12px 12px 96px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .card{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:13px 12px;
    text-align:left;display:flex;flex-direction:column;gap:6px;min-height:96px}
  .card:active{border-color:var(--acc);transform:scale(.985)}
  .card .t{font-size:13.5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;
    -webkit-box-orient:vertical;overflow:hidden}
  .card .p{font-size:11.5px;color:var(--fg3);margin-top:auto}
  .read{padding:8px 18px 120px;max-width:720px;margin:0 auto}
  .read .chap{font-size:15px;margin:24px 0 14px;font-weight:600;line-height:1.5}
  .read .p{font-family:var(--serif);font-size:var(--fs);line-height:var(--lh);margin:0 0 13px;text-indent:2em}
  .read .p.marked{background:color-mix(in srgb,var(--acc) 18%,transparent);border-radius:3px}
  .read .preview{color:var(--fg3);font-size:12px;border-top:1px dashed var(--line);padding-top:10px;
    margin-top:16px;line-height:1.7}
  .toc{position:fixed;left:0;top:0;bottom:0;width:84vw;max-width:380px;z-index:40;background:var(--bg2);
    border-right:1px solid var(--line);display:flex;flex-direction:column}
  .toc-h{display:flex;align-items:center;height:48px;padding:0 10px;border-bottom:1px solid var(--line);font-size:13px}
  .toc-h b{flex:1;font-weight:600;padding-left:4px}
  .toc-l{flex:1;overflow:auto;padding:4px 0 40px}
  .toc-r{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:11px 12px;
    font-size:13px;color:var(--fg2);border-bottom:1px solid var(--line)}
  .toc-r.on{color:var(--acc);background:color-mix(in srgb,var(--acc) 8%,transparent)}
  .toc-no{flex:none;min-width:34px;color:var(--fg3);font-size:11.5px}
  .toc-t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30}
  .fz{position:fixed;right:10px;top:52px;z-index:30;display:flex;align-items:center;gap:2px;
    background:var(--bg2);border:1px solid var(--line2);border-radius:12px;padding:5px}
  .fz[hidden]{display:none}
  .fz-b{min-width:52px;height:40px;border-radius:9px;display:grid;place-items:center;font-size:15px}
  .fz-b:active{background:var(--line)}
  .fz-v{min-width:34px;text-align:center;font-size:12px;color:var(--fg3)}
  .pill{position:fixed;right:14px;bottom:18px;z-index:25;background:var(--acc);color:#fff;
    border-radius:999px;padding:11px 18px;font-size:12.5px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
  .toast{position:fixed;left:50%;bottom:80px;transform:translate(-50%,8px);background:var(--bg2);
    border:1px solid var(--line2);color:var(--fg2);border-radius:999px;padding:8px 15px;font-size:12.5px;
    opacity:0;transition:.16s;z-index:26;max-width:86vw;text-align:center}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .hidden{display:none !important}
</style>
</head>
<body>

<header class="top">
  <button class="ic" id="btnBack" title="返回">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <button class="ic" id="btnToc" title="目錄">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <div class="ttl" id="title">遊客預覽</div>
  <button class="ic" id="btnFont" title="字級">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 18l5-13 5 13"/><path d="M5.6 14.2h6.8"/><path d="M17.5 8.5v8"/><path d="M15.3 10.7l2.2-2.2 2.2 2.2"/>
    </svg>
  </button>
  <button class="ic" id="btnTheme" title="換色">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
  </button>
</header>

<div class="guest" id="guestBar"><b>遊客預覽</b>　只用示例書與示例章節，不會連到任何人的帳號與進度。</div>

<div class="fz" id="fz" hidden>
  <button class="fz-b" id="fzMinus">A−</button><span class="fz-v" id="fzVal">17</span><button class="fz-b" id="fzPlus">A+</button>
</div>

<main id="view"></main>

<div class="toc" id="toc" hidden>
  <div class="toc-h"><b>目錄</b><button class="ic" id="tocClose">✕</button></div>
  <div class="toc-l" id="tocList"></div>
</div>
<div class="mask" id="mask" hidden></div>
<button class="pill" id="remember">記住進度</button>
<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var view = $('view'), titleEl = $('title');

  /* ── 示例資料（不是任何人的真實書單） ── */
  var BOOKS = [
    { id: 'demo-1', title: '示例書：山門外的帳房', prefix: '沙' },
    { id: 'demo-2', title: '示例書：夜市燈下的約定', prefix: '夜' },
    { id: 'demo-3', title: '示例書：十二封沒寄出的信', prefix: '信' },
    { id: 'demo-4', title: '示例書：北方港口的春天', prefix: '港' }
  ];
  var CHAPTERS = [];
  for (var i = 1; i <= 12; i++) CHAPTERS.push({ id: 'demo-c' + i, no: i, title: '第 ' + i + ' 章 ' + ['起程', '舊賬', '夜談', '山路', '回信', '渡口', '冬雪', '燈火', '離席', '歸人', '長夜', '收尾'][i - 1] });

  var SAMPLE = [
    '這是遊客預覽用的示例章節，文字是為了讓你看清楚排版而寫的，不是任何一本真的書。',
    '字體、行距、字級、段距都可以直接在這裡調；右上角那個圓形按鈕可以切換深色與淺色。',
    '點任何一個段落會加上底色，代表「劃線」——真實版本裡，劃線與筆記會同步到雲端。',
    '滾到最底下會自動接下一章，這和桌面版的行為一致；差別只在這裡的章節是示例資料。',
    '如果你想要自己的書與進度，請用桌面版產生的那條帶金鑰的網址打開，這個頁面刻意不連任何帳號。',
    '段落與段落之間的距離、每行的長度，都是照著長時間閱讀調整過的；你可以把字級拉到 22 以上試試。',
    '這一頁沒有任何追蹤、沒有任何外部請求，連字體都只用系統內建的，關掉網路也打得開。',
    '左上的箭頭回到書架，漢堡打開目錄；這兩個按鈕在真實版本裡是固定的。'
  ];

  var state = { book: null, index: 0, theme: 'dark', font: 17 };

  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function toast(t) {
    var el = $('toast');
    el.textContent = t;
    el.classList.add('on');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.classList.remove('on'); }, 1700);
  }

  function setFont(v) {
    state.font = Math.max(13, Math.min(26, Math.round(v)));
    document.documentElement.style.setProperty('--fs', state.font + 'px');
    $('fzVal').textContent = String(state.font);
  }

  function renderShelf() {
    $('btnToc').classList.add('hidden');
    $('btnFont').classList.add('hidden');
    $('fz').hidden = true;
    $('remember').classList.add('hidden');
    titleEl.textContent = '書架';
    var wrap = document.createElement('div');
    wrap.className = 'shelf';
    BOOKS.forEach(function (b) {
      var card = document.createElement('button');
      card.className = 'card';
      card.innerHTML = '<span class="t">' + esc(b.title) + '</span><span class="p">示例 · 共 12 章</span>';
      card.addEventListener('click', function () { openBook(b); });
      wrap.appendChild(card);
    });
    view.innerHTML = '';
    view.appendChild(wrap);
  }

  function openBook(b) {
    state.book = b;
    state.index = 0;
    $('btnToc').classList.remove('hidden');
    $('btnFont').classList.remove('hidden');
    $('remember').classList.remove('hidden');
    $('btnBack').classList.remove('hidden');
    readFrom(0, true);
  }

  function readFrom(i, wipe) {
    state.index = i;
    var ch = CHAPTERS[i];
    if (!ch) return;
    if (wipe) { view.innerHTML = '<div class="read" id="readBox"></div>'; window.scrollTo(0, 0); }
    var box = $('readBox');
    var h = document.createElement('div');
    h.className = 'chap';
    h.textContent = ch.title;
    box.appendChild(h);
    SAMPLE.forEach(function (text) {
      var p = document.createElement('p');
      p.className = 'p';
      p.textContent = text;
      p.addEventListener('click', function () { p.classList.toggle('marked'); });
      box.appendChild(p);
    });
    if (i === CHAPTERS.length - 1) {
      var note = document.createElement('div');
      note.className = 'preview';
      note.textContent = '示例章節結束。真實版本會繼續接下一章。';
      box.appendChild(note);
    }
    titleEl.textContent = ch.title;
  }

  function openToc() {
    var list = $('tocList');
    list.innerHTML = '';
    CHAPTERS.forEach(function (c, i) {
      var b = document.createElement('button');
      b.className = 'toc-r' + (i === state.index ? ' on' : '');
      b.innerHTML = '<span class="toc-no">' + c.no + '</span><span class="toc-t">' + esc(c.title.replace(/^第\s*\d+\s*章\s*/, '')) + '</span>';
      b.addEventListener('click', function () { closeToc(); readFrom(i, true); });
      list.appendChild(b);
    });
    $('toc').hidden = false;
    $('mask').hidden = false;
  }
  function closeToc() { $('toc').hidden = true; $('mask').hidden = true; }

  $('btnBack').addEventListener('click', function () { state.book = null; renderShelf(); });
  $('btnToc').addEventListener('click', openToc);
  $('tocClose').addEventListener('click', closeToc);
  $('mask').addEventListener('click', closeToc);
  $('btnFont').addEventListener('click', function (e) { e.stopPropagation(); $('fz').hidden = !$('fz').hidden; });
  $('fzMinus').addEventListener('click', function () { setFont(state.font - 1); });
  $('fzPlus').addEventListener('click', function () { setFont(state.font + 1); });
  $('btnTheme').addEventListener('click', function () {
    state.theme = state.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', state.theme);
    toast(state.theme === 'dark' ? '深色' : '淺色');
  });
  $('remember').addEventListener('click', function () {
    toast('遊客模式不寫進度；真實版本會同步到你的帳號');
  });
  document.addEventListener('click', function (e) {
    if ($('fz').hidden) return;
    if ($('fz').contains(e.target) || $('btnFont').contains(e.target)) return;
    $('fz').hidden = true;
  });

  setFont(17);
  renderShelf();
})();
</script>
</body>
</html>
