<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#ff6b35">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ff6b35'/%3E%3Ccircle cx='32' cy='32' r='16' fill='none' stroke='%23fff' stroke-width='5'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%23fff'/%3E%3C/svg%3E">
<title>魔芋一夏</title>
<link rel="stylesheet" href="m.css">
</head>
<body>

<!-- ── 書架 ── -->
<section class="page" id="pShelf">
  <header class="hdr">
    <h1>書架</h1>
    <button class="ic" id="btnLogin" title="登入">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6"/></svg>
    </button>
  </header>
  <div class="sheet" id="shelfState"></div>
  <div class="grid" id="shelfGrid"></div>
</section>

<!-- ── 搜尋 ── -->
<section class="page" id="pSearch" hidden>
  <header class="hdr"><h1>搜尋</h1></header>
  <div class="searchbar">
    <svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="5.8"/><path d="m15.2 15.2 4 4"/></svg>
    <input id="q" inputmode="search" placeholder="書號、網址或書名關鍵字" autocomplete="off">
  </div>
  <div class="sheet" id="searchState">貼上番茄書頁網址或書號，直接開書。</div>
  <div class="list" id="searchList"></div>
</section>

<!-- ── 我的 ── -->
<section class="page" id="pMe" hidden>
  <header class="hdr"><h1>我的</h1></header>
  <div class="card">
    <div class="row"><span>登入狀態</span><b id="meLogin">—</b></div>
    <div class="row"><span>閱讀時長</span><b id="meTime">—</b></div>
    <div class="row"><span>已讀章節</span><b id="meChapters">—</b></div>
    <div class="row"><span>版本</span><b id="meVer">—</b></div>
  </div>
  <div class="card">
    <div class="row act" id="meSync">立即同步</div>
    <div class="row act" id="meTheme">閱讀背景</div>
    <div class="row act" id="meClear">清除本機快取</div>
  </div>
</section>

<!-- ── 閱讀器 ── -->
<section class="reader" id="reader" hidden>
  <div class="r-head" id="rHead">
    <button class="ic" id="rBack" title="返回"><svg viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg></button>
    <span class="r-title" id="rTitle"></span>
    <button class="ic" id="rToc" title="目錄"><svg viewBox="0 0 24 24"><path d="M4.5 6.5h15M4.5 12h15M4.5 17.5h10"/></svg></button>
  </div>

  <div class="r-body" id="rBody"></div>

  <div class="r-foot" id="rFoot">
    <button class="ic" id="rPrev"><svg viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg></button>
    <span class="r-pos" id="rPos">— / —</span>
    <button class="ic" id="rNext"><svg viewBox="0 0 24 24"><path d="M9.5 5.5 16 12l-6.5 6.5"/></svg></button>
    <button class="ic" id="rFont" title="字體"><svg viewBox="0 0 24 24"><path d="M5 18 12 5l7 13"/><path d="M8.2 13.5h7.6"/></svg></button>
  </div>

  <div class="drawer" id="toc" hidden>
    <div class="drawer-head"><b>目錄</b><button class="ic" id="tocClose"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <input class="drawer-q" id="tocQ" placeholder="篩選章節">
    <div class="drawer-list" id="tocList"></div>
  </div>

  <div class="sheetfont" id="fontSheet" hidden>
    <div class="fs-row"><span>字級</span><input type="range" id="fsSize" min="15" max="26" step="1"><b id="fsSizeV">18</b></div>
    <div class="fs-row"><span>行距</span><input type="range" id="fsLh" min="1.4" max="2.4" step="0.1"><b id="fsLhV">1.9</b></div>
    <div class="fs-row"><span>背景</span>
      <div class="swatches" id="fsBg">
        <i data-bg="paper" style="background:#f5f0e6"></i>
        <i data-bg="white" style="background:#fff"></i>
        <i data-bg="green" style="background:#e9f0e3"></i>
        <i data-bg="night" style="background:#181a1b"></i>
      </div>
    </div>
  </div>
</section>

<nav class="tabbar" id="tabbar">
  <button class="tab on" data-tab="shelf">
    <svg viewBox="0 0 24 24"><path d="M5 4.5h9a3 3 0 0 1 3 3v12H8a3 3 0 0 0-3 3z"/><path d="M5 4.5v15"/></svg><span>書架</span>
  </button>
  <button class="tab" data-tab="search">
    <svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="5.8"/><path d="m15.2 15.2 4 4"/></svg><span>搜尋</span>
  </button>
  <button class="tab" data-tab="me">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6"/></svg><span>我的</span>
  </button>
</nav>

<!-- 掃碼登入 -->
<div class="modal" id="qrModal" hidden>
  <div class="modal-card">
    <div class="modal-head"><b>掃碼登入</b><button class="ic" id="qrClose"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="qr-box" id="qrBox"><span>產生中…</span></div>
    <p class="qr-tip" id="qrTip">用抖音或番茄 App 掃描</p>
  </div>
</div>

<script src="m.js"></script>
</body>
</html>
